[package]
name = "dbettier-gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6"
gpui-kit = { version = "0.7.1", features = ["tree-sitter-sql"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = [ "postgres", "runtime-tokio", "tls-native-tls", "uuid", "chrono" ] }
thiserror = "2"
futures = "0.3.34"

[dependencies.uuid]
version = "1.23.1"
# Lets you generate random UUIDs
features = [
    "v4",
    "v7",
]
